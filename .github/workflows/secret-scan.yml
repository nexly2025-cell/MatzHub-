name: Secret Scan

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Block anything that looks like a live secret
        run: |
          PATTERNS=(
            '(sk-[A-Za-z0-9]{20,})'
            '(sb_secret_[A-Za-z0-9_-]{20,})'
            '(sb_publishable_[A-Za-z0-9_-]{20,})'
            '(service_role["\x27]?\s*[:=]\s*["\x27]?[A-Za-z0-9_\-]{20,})'
            '(whsec_[A-Za-z0-9]{20,})'
            '(AKIA[0-9A-Z]{16})'
            '(AIza[0-9A-Za-z_-]{35})'
            '(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})'
            '(xox[pbar]-[0-9A-Za-z-]{10,})'
            '(rzp_live_[A-Za-z0-9]{14,})'
          )
          FAILED=0
          for pattern in "${PATTERNS[@]}"; do
            if git grep -qE "$pattern" -- ':!*\.mjs' ':!*.localhost.*' ':!node_modules' ':!*\.env\.example' ':!*\.env\.docker*' ':!*.test.ts' ':!*.test.*' ':!.github/workflows/secret-scan.yml'; then
              echo "#### ✗ SECRET DETECTED: $pattern"
              git grep -nE "$pattern" -- ':!*\.mjs'
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "Secret scan FAILED — rotate exposed credentials before merging."
            exit 1
          fi
          echo "#### ✓ Secret scan clean"

      # A live Supabase pooler URL — password inline — was once committed as a
      # "fallback" inside src/db/index.ts and none of the patterns above match
      # it. Connection strings are credentials; treat them as such.
      - name: Block database connection strings with inline passwords
        run: |
          HITS=$(git grep -nE 'postgres(ql)?://[^:@/[:space:]]+:[^@/[:space:]]+@' \
                   -- ':!node_modules' ':!*.env.example' ':!.github/workflows/secret-scan.yml' \
                 | grep -vE 'localhost|127\.0\.0\.1|::1|<[A-Za-z_-]+>|USER:PASSWORD|user:pass' || true)
          if [ -n "$HITS" ]; then
            echo "#### ✗ DATABASE CREDENTIAL DETECTED"
            echo "$HITS" | sed -E 's#(postgres(ql)?://[^:]+:)[^@]+@#\1***@#g'
            echo "Rotate the credential and read it from DATABASE_URL instead."
            exit 1
          fi
          echo "#### ✓ No inline database credentials"

      - name: Block .env files from being committed
        run: |
          if git ls-files | grep -E '^\.env($|\..*[^e]-[p][r][o][d][u][c][t][i][o][n]$|^[.]env$|^worker/\.env$)' | grep -v '.env.example' | grep -v '.env.docker.example' | grep -q .; then
            echo "#### ✗ .env file committed. This is a security violation."
            git ls-files | grep '\.env' || true
            exit 1
          fi
          echo "#### ✓ No .env files committed"
